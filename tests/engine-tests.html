<!doctype html><meta charset="utf-8"><title>CDSS engine tests</title><pre id="out"></pre><script src="../js/uuid.js"></script><script src="../js/guidelines/guidelines-db.js"></script><script src="../js/engine/risk-calculator.js"></script><script src="../js/engine/ttr-calculator.js"></script><script src="../js/engine/safety-gate.js"></script><script src="../js/engine/nomogram.js"></script><script src="../js/engine/dose-scheduler.js"></script><script src="../js/engine/regimen-planner.js"></script><script>const out=document.getElementById('out');let n=0;function test(name,fn){try{fn();out.textContent+='PASS '+name+'\n';n++}catch(e){out.textContent+='FAIL '+name+': '+e.message+'\n'}}function eq(a,b){if(JSON.stringify(a)!==JSON.stringify(b))throw Error(JSON.stringify(a)+' != '+JSON.stringify(b))}test('unique day names',()=>eq(new Set(CDSS.scheduler.DAYS).size,7));test('CHA age75=2',()=>eq(CDSS.risk.cha(75,{}).score,2));test('pregnancy stop',()=>eq(CDSS.safety({pregnancy:true}).stop,true));test('INR 4.8 stop',()=>eq(CDSS.safety({pregnancy:false,procedure:false,bleeding:'none',inr:4.8}).stop,true));test('target maintain',()=>eq(CDSS.nomogram(2.5,{min:2,max:3},35,true,true,'af').newDose,35));test('mechanical low no auto',()=>eq(CDSS.nomogram(1.7,{min:2.5,max:3.5},35,false,true,'mmv').canDose,false));test('schedule total',()=>{const r=CDSS.scheduler.schedule(35,0,.5);eq(r.reduce((a,b)=>a+b.dose,0),35)});test('planner creates alternatives',()=>{const c=CDSS.regimenPlanner.generateCandidates(22.5,[1,2,3,5],.5,3);if(c.length<1||c.length>3)throw Error('candidate count');c.forEach(x=>eq(x.total,22.5))});test('dispense rounds whole tablets',()=>{const c=CDSS.regimenPlanner.generateCandidates(22.5,[1,2,3,5],.5,3)[0],d=CDSS.regimenPlanner.calculateDispense(c,30,2,{1:1});if(d.totalDays!==32||d.summary.some(x=>!Number.isInteger(x.dispenseWholeTablets)))throw Error('dispense');});test('quarter-tablet decomposition',()=>{const x=CDSS.regimenPlanner.decomposeDose(1.25,[5],.25);if(!x||x[0].tablets!==.25)throw Error('quarter');});out.textContent+='\n'+n+' tests passed';</script>
